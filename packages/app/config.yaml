# Diana 运行配置
protocol:
  # 协议平台：windows / linux（对应 AppInfo 预设）
  os: linux
  # 客户端版本：留空用预设，填 custom 则读取工作目录的 app-info.json
  version: 'custom'
  # SSO 登录服务器（host:port 或完整 URL）
  server: msfwifi.3g.qq.com:8080
  # 签名服务器地址（POST，留空则不签名）
  signServer: http://122.51.25.58:5991
  # 签名服务器 token（留空则不携带）
  signToken: ''
  # 二维码轮询间隔（毫秒）
  interval: 5000

onebot:
  # 正向 WebSocket：本端监听，客户端连接
  forwardWs:
    host: 0.0.0.0
    port: 3000
  # 反向 WebSocket：主动连接的对端地址
  reverseWs: []
  # HTTP API：本端监听
  http:
    host: 0.0.0.0
    port: 3001
  # HTTP POST：事件上报地址
  httpPost: []
  # 访问令牌（留空则不校验）
  accessToken: ''
  # 心跳间隔（毫秒），0 表示关闭
  heartbeatInterval: 30000

# 日志配置
log:
  # 全局日志等级：trace / debug / info / warn / error / fatal
  # debug 及以上会打印 Alive 保活与核心推送等细节
  level: info

# 登录会话持久化路径
sessionFile: .diana/session.json
# 二维码图片保存路径
qrImageFile: .diana/qrcode.png
